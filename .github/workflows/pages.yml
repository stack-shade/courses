name: Build and Deploy StackShade Courses to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11"

      - name: Install web dependencies
        run: pnpm --dir apps/web install --frozen-lockfile

      - name: Type-check web app
        run: pnpm --dir apps/web typecheck

      - name: Build animated HTML slides and Next.js static export
        env:
          NEXT_PUBLIC_BASE_PATH: /courses
        run: pnpm --dir apps/web build

      - name: Verify static output routes and HTML slide decks
        run: |
          test -f apps/web/out/index.html
          test -f apps/web/out/courses/system-design/index.html
          test -f apps/web/out/courses/system-design/practice/index.html
          test -f apps/web/out/downloads/system-design/index.html
          test -f apps/web/out/downloads/system-design/01-course-kickoff.html
          test -f apps/web/out/downloads/system-design/40-system-evolution.html
          test -f apps/web/out/search-index.json
          test -f apps/web/out/visuals/widgets.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
